<div class="container">

  <!-- Table utilisateurs -->
  <mat-card class="table-card" *ngIf="!loading">
    <div class="table-header">
      <span class="table-title">Gestion des Utilisateurs</span>
      <button mat-raised-button class="add-btn" (click)="router.navigate(['/users/new'])">
        <mat-icon>person_add</mat-icon>
        Nouvel utilisateur
      </button>
    </div>
    <mat-divider></mat-divider>
    <mat-card-content>
      <table mat-table [dataSource]="users" class="users-table">

        <!-- Nom -->
        <ng-container matColumnDef="nom">
          <th mat-header-cell *matHeaderCellDef>Utilisateur</th>
          <td mat-cell *matCellDef="let u">
            <div class="user-cell">
              <div class="user-name">{{ u.prenom }} {{ u.nom }}</div>
            </div>
          </td>
        </ng-container>

        <!-- Email -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let u">{{ u.email }}</td>
        </ng-container>

        <!-- Rôle -->
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Rôle</th>
          <td mat-cell *matCellDef="let u">
            <span class="role-badge role-{{ getRoleColor(u.userRole) }}">
              {{ getRoleLabel(u.userRole) }}
            </span>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let u">
            <button mat-icon-button color="primary"
                    matTooltip="Modifier"
                    (click)="router.navigate(['/users/edit', u.id])">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn"
                    [matTooltip]="u.email === currentUserEmail ? 'Vous ne pouvez pas supprimer votre propre compte' : 'Supprimer'"
                    [disabled]="u.email === currentUserEmail"
                    (click)="deleteUser(u)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div class="empty-state" *ngIf="users.length === 0">
        <mat-icon>people_outline</mat-icon>
        <p>Aucun utilisateur trouvé</p>
      </div>
    </mat-card-content>
  </mat-card>

</div>

<!-- Loading -->
<div class="loading-container" *ngIf="loading">
  <mat-icon class="loading-icon">hourglass_empty</mat-icon>
  <p>Chargement des utilisateurs...</p>
</div>
