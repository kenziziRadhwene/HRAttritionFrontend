<div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar">

    <div class="sidebar-brand">
      <div class="brand-logo-wrapper">
        <img src="/ooredoo_logOuverte.png" class="logo-ouverte" alt="Ooredoo"/>
        <img src="/ooredoo_logFerme.png"   class="logo-ferme"   alt="Ooredoo"/>
      </div>
    </div>

    <div class="brand-divider"></div>

    <nav class="sidebar-nav">

      <p class="nav-section-title">
        <span class="section-title-text">Tableau de bord</span>
        <span class="section-title-line"></span>
      </p>
      <button class="nav-item"
              [class.active]="isActiveRoute('/dashboard')"
              (click)="navigateTo('/dashboard')"
              matTooltip="Dashboard"
              matTooltipPosition="right"
              [matTooltipDisabled]="!sidebarCollapsed">
        <span class="nav-item-bg"></span>
        <mat-icon>dashboard</mat-icon>
        <span class="nav-label">Dashboard</span>
      </button>

      <ng-container *ngIf="isAdmin || isRH">
        <p class="nav-section-title">
          <span class="section-title-text">Gestion RH</span>
          <span class="section-title-line"></span>
        </p>
        <button class="nav-item"
                [class.active]="isActiveRoute('/employees')"
                (click)="navigateTo('/employees')"
                matTooltip="Employés"
                matTooltipPosition="right"
                [matTooltipDisabled]="!sidebarCollapsed">
          <span class="nav-item-bg"></span>
          <mat-icon>people</mat-icon>
          <span class="nav-label">Employés</span>
        </button>
        <button class="nav-item"
                [class.active]="isActiveRoute('/alertes')"
                (click)="navigateTo('/alertes')"
                matTooltip="Alertes"
                matTooltipPosition="right"
                [matTooltipDisabled]="!sidebarCollapsed">
          <span class="nav-item-bg"></span>
          <mat-icon>notifications</mat-icon>
          <span class="nav-label">Alertes</span>
          <span class="nav-badge" *ngIf="alertesNonLues > 0">{{ alertesNonLues }}</span>
        </button>
        <button class="nav-item"
                [class.active]="isActiveRoute('/simulation')"
                (click)="navigateTo('/simulation')"
                matTooltip="Simulation ML"
                matTooltipPosition="right"
                [matTooltipDisabled]="!sidebarCollapsed">
          <span class="nav-item-bg"></span>
          <mat-icon>science</mat-icon>
          <span class="nav-label">Simulation ML</span>
        </button>
      </ng-container>

      <p class="nav-section-title">
        <span class="section-title-text">Analyse</span>
        <span class="section-title-line"></span>
      </p>
      <button class="nav-item"
              [class.active]="isActiveRoute('/recommandations')"
              (click)="navigateTo('/recommandations')"
              matTooltip="Recommandations"
              matTooltipPosition="right"
              [matTooltipDisabled]="!sidebarCollapsed">
        <span class="nav-item-bg"></span>
        <mat-icon>lightbulb</mat-icon>
        <span class="nav-label">Recommandations</span>
      </button>

      <ng-container *ngIf="isAdmin || isManager">
        <p class="nav-section-title">
          <span class="section-title-text">Équipe</span>
          <span class="section-title-line"></span>
        </p>
        <button class="nav-item"
                [class.active]="isActiveRoute('/team')"
                (click)="navigateTo('/team')"
                matTooltip="Vue Équipe"
                matTooltipPosition="right"
                [matTooltipDisabled]="!sidebarCollapsed">
          <span class="nav-item-bg"></span>
          <mat-icon>groups</mat-icon>
          <span class="nav-label">Vue Équipe</span>
        </button>
      </ng-container>

      <ng-container *ngIf="isAdmin">
        <p class="nav-section-title">
          <span class="section-title-text">Administration</span>
          <span class="section-title-line"></span>
        </p>
        <button class="nav-item"
                [class.active]="isActiveRoute('/users')"
                (click)="navigateTo('/users')"
                matTooltip="Gestion Utilisateurs"
                matTooltipPosition="right"
                [matTooltipDisabled]="!sidebarCollapsed">
          <span class="nav-item-bg"></span>
          <mat-icon>manage_accounts</mat-icon>
          <span class="nav-label">Gestion Utilisateurs</span>
        </button>
      </ng-container>

    </nav>

    <div class="sidebar-footer">
      <div class="footer-divider"></div>
      <button class="nav-item nav-logout"
              (click)="logout()"
              matTooltip="Déconnexion"
              matTooltipPosition="right"
              [matTooltipDisabled]="!sidebarCollapsed">
        <span class="nav-item-bg"></span>
        <mat-icon>logout</mat-icon>
        <span class="nav-label">Déconnexion</span>
      </button>
    </div>
  </aside>

  <!-- ═══════════════ CONTENU PRINCIPAL ═══════════════ -->
  <div class="main-content">

    <!-- TOOLBAR -->
    <mat-toolbar class="toolbar" [class.toolbar-shadow]="hasScrolled">
      <div class="toolbar-left">
        <button mat-icon-button (click)="toggleSidebar()" class="toggle-btn"
                [matTooltip]="sidebarCollapsed ? 'Ouvrir le menu' : 'Fermer le menu'"
                matTooltipPosition="right">
          <mat-icon class="toggle-icon">{{ sidebarCollapsed ? 'menu' : 'menu_open' }}</mat-icon>
        </button>
      </div>
      <div class="toolbar-right">
        <div class="user-avatar" [style.background]="avatarColor">{{ userInitials }}</div>
        <span class="toolbar-user">{{ currentUser }}</span>
        <div class="toolbar-divider"></div>
        <button mat-icon-button (click)="logout()" matTooltip="Déconnexion" class="logout-btn">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </mat-toolbar>

    <!-- ✅ BREADCRUMB — affiché sous la toolbar, au-dessus du contenu -->
    <app-breadcrumb></app-breadcrumb>

    <!-- CONTENU DES PAGES -->
    <div class="page-content" (scroll)="onContentScroll($event)">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
